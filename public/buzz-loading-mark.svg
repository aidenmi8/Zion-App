<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Zion loading</title>
  <defs><linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f5f7"/><stop offset=".55" stop-color="#a6a6a8"/><stop offset="1" stop-color="#68686b"/></linearGradient></defs>
  <style>
    g { transform-origin: center; animation: zion-motion-loader-breathe 1.8s ease-in-out infinite; }
    @keyframes zion-motion-loader-breathe {
      0%, 100% { opacity: .76; transform: scale(.965); filter: drop-shadow(0 0 .35rem rgb(78 124 255 / .08)); }
      50% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 .8rem rgb(78 124 255 / .22)); }
    }
    @media (prefers-reduced-motion: reduce) { g { animation: none; opacity: .9; transform: scale(1); filter: drop-shadow(0 0 .25rem rgb(78 124 255 / .1)); } }
  </style>
  <g fill="url(#silver)"><path d="M16 30 32 12h20L36 30H16Z"/><path d="M12 52 28 34h20L32 52H12Z"/></g>
</svg>
